<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pachanga — Carné Pachangoso</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eee;font-family:Arial,sans-serif;color:#222}
  .wrap{max-width:1050px;margin:0 auto;padding:22px}
  h1{margin:0 0 6px}
  .sub{margin:0 0 20px;color:#666}
  .panel{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 12px #0001;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  label{font-weight:700;font-size:14px}
  input{width:100%;margin-top:6px;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px}
  .full{grid-column:1/-1}
  button{border:0;border-radius:9px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
  #generate{background:#111;color:#f4d36b}
  #download{background:#f4d36b;color:#111;margin-left:8px}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#000}
  .note{font-size:13px;color:#666;margin-top:10px}
  @media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Generador de Carné Pachangoso</h1>
    <p class="sub">Prototipo: completá los datos y generá el JPG.</p>
    <div class="grid">
      <div><label>Nombre<input id="nombre" value="Noelia"></label></div>
      <div><label>Edad<input id="edad" value="49"></label></div>
      <div><label>Localidad<input id="localidad" value="Mataderos"></label></div>
      <div><label>Superhéroe favorito<input id="heroe" value="Pitufina"></label></div>
      <div><label>¿Con qué famoso/a pasarías una noche?<input id="famoso" value="Lenny Kravitz"></label></div>
      <div><label>Último boliche al que fuiste<input id="boliche" value="Cheka"></label></div>
      <div class="full"><label>Foto<input id="foto" type="file" accept="image/*"></label></div>
    </div>
    <button id="generate">🖼 Generar carné</button>
    <button id="download">⬇ Descargar JPG</button>
    <p class="note">Este prototipo usa la imagen enviada como referencia visual. En la versión definitiva, el diseño se reconstruye como plantilla editable.</p>
  </div>
  <div class="panel">
    <canvas id="canvas" width="1463" height="1081"></canvas>
  </div>
</div>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let photo = null;

document.getElementById("foto").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    photo = new Image();
    photo.onload = render;
    photo.src = r.result;
  };
  r.readAsDataURL(f);
});

function fitText(text, maxWidth, maxSize, minSize=18) {
  let size = maxSize;
  ctx.font = `${size}px "Trebuchet MS", Arial, sans-serif`;
  while (ctx.measureText(text).width > maxWidth && size > minSize) {
    size -= 1;
    ctx.font = `${size}px "Trebuchet MS", Arial, sans-serif`;
  }
  return size;
}

function roundedImage(img, x, y, w, h, r) {
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.clip();
  const s = Math.max(w/img.width, h/img.height);
  const nw = img.width*s, nh = img.height*s;
  ctx.drawImage(img, x+(w-nw)/2, y+(h-nh)/2, nw, nh);
  ctx.restore();
}

function render() {
  if (!bg.complete) return;
  ctx.drawImage(bg,0,0,canvas.width,canvas.height);

  // Cover the variable text regions from the reference image.
  ctx.fillStyle = "#000";
  [
    [365,292,470,78],
    [365,389,470,78],
    [365,486,470,78],
    [365,583,470,80],
    [365,680,470,80],
    [365,790,470,80]
  ].forEach(r=>ctx.fillRect(...r));

  // Cover reference photo.
  ctx.fillRect(858,205,552,720);

  // Recreate the photo frame.
  if (photo) roundedImage(photo, 861,208,546,714,39);

  const vals = [
    document.getElementById("nombre").value || "",
    (document.getElementById("edad").value || "") + " años",
    document.getElementById("localidad").value || "",
    document.getElementById("heroe").value || "",
    document.getElementById("famoso").value || "",
    document.getElementById("boliche").value || ""
  ];
  const ys = [350,447,544,641,738,846];
  ctx.fillStyle = "#f5f2e8";
  ctx.textBaseline = "middle";
  vals.forEach((t,i)=>{
    const size=fitText(t,455,40,19);
    ctx.font = `${size}px "Trebuchet MS", Arial, sans-serif`;
    ctx.fillText(t,375,ys[i]);
  });
}

bg.onload = render;
document.getElementById("generate").onclick = render;
document.getElementById("download").onclick = () => {
  render();
  const a=document.createElement("a");
  a.download=(document.getElementById("nombre").value||"carne-pachangoso")+".jpg";
  a.href=canvas.toDataURL("image/jpeg",0.94);
  a.click();
};
</script>
