<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pachanga — Carné Pachangoso</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eee;font-family:Arial,sans-serif;color:#222}
  .wrap{max-width:1050px;margin:0 auto;padding:22px}
  h1{margin:0 0 6px}
  .sub{margin:0 0 20px;color:#666}
  .panel{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 12px #0001;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  label{font-weight:700;font-size:14px}
  input{width:100%;margin-top:6px;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px}
  .full{grid-column:1/-1}
  button{border:0;border-radius:9px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
  #generate{background:#111;color:#f4d36b}
  #download{background:#f4d36b;color:#111;margin-left:8px}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#000}
  .note{font-size:13px;color:#666;margin-top:10px}
  @media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Generador de Carné Pachangoso</h1>
    <p class="sub">Prototipo: completá los datos y generá el JPG.</p>
    <div class="grid">
      <div><label>Nombre<input id="nombre" value=""></label></div>
      <div><label>Edad<input id="edad" value=""></label></div>
      <div><label>Localidad<input id="localidad" value=""></label></div>
      <div><label>Superhéroe favorito<input id="heroe" value=""></label></div>
      <div><label>¿Con qué famoso/a pasarías una noche?<input id="famoso" value=""></label></div>
      <div><label>Último boliche al que fuiste<input id="boliche" value=""></label></div>
      <div class="full"><label>Foto<input id="foto" type="file" accept="image/*"></label></div>
    </div>
    <button id="generate">🖼 Generar carné</button>
    <button id="download">⬇ Descargar JPG</button>
    <p class="note">Este prototipo genera el carné con los datos ingresados.</p>
  </div>
  <div class="panel">
    <canvas id="canvas" width="1463" height="1081"></canvas>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const bg = new Image();
bg.src = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCARUBgADASIAAhEBAxEB/8QAHgAAAgEFAQEBAAAAAAAAAAAAAAECBAUGBwgJAwr/xABsEAABAwMBBAQHBgsQDQwBBAMBAAIDBAURBgcSITEIE0FRCRQiMmFx0UKBkZSV0hUWFxgjUlZ0obHBGTM2N0ZHVVdicnOFkpOy4SRDRFNUZHWChLPCw9MlJzQ1OEVjg6KjtPAoJmWWpPGG4v/EABsBAQADAQEBAQAAAAAAAAAAAAABAvg3X1888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888 let userFoto = null;

document.getElementById('foto').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(evt) {
      userFoto = new Image();
      userFoto.onload = drawCanvas;
      userFoto.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  }
});

function drawCanvas() {
  // Limpiar canvas
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Dibuja la imagen base
  ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);

  // Obtener los datos actuales del formulario
  const nombre = document.getElementById('nombre').value;
  const edad = document.getElementById('edad').value;
  const localidad = document.getElementById('localidad').value;
  const heroe = document.getElementById('heroe').value;
  const famoso = document.getElementById('famoso').value;
  const boliche = document.getElementById('boliche').value;

  // Configuración de texto
  ctx.font = 'bold 36px Arial';
  ctx.fillStyle = '#000000';

  // Ocultar/tapar datos previos de la plantilla (si existen) con rectángulos blancos
  // Ajusta estas posiciones si tu plantilla trae textos predeterminados impresos sobre la imagen
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(520, 290, 400, 50); // Fondo Nombre
  ctx.fillRect(520, 360, 200, 50); // Fondo Edad
  ctx.fillRect(520, 430, 400, 50); // Fondo Localidad
  ctx.fillRect(520, 500, 400, 50); // Fondo Superhéroe
  ctx.fillRect(520, 570, 400, 50); // Fondo Famoso
  ctx.fillRect(520, 640, 400, 50); // Fondo Boliche

  // Escribir solo si el usuario ingresó algún valor
  ctx.fillStyle = '#000000';
  if (nombre) ctx.fillText(nombre, 530, 330);
  if (edad) ctx.fillText(edad, 530, 400);
  if (localidad) ctx.fillText(localidad, 530, 470);
  if (heroe) ctx.fillText(heroe, 530, 540);
  if (famoso) ctx.fillText(famoso, 530, 610);
  if (boliche) ctx.fillText(boliche, 530, 680);

  // Dibujar la foto subida si existe
  if (userFoto) {
    // Ejemplo de ubicación de foto: ajustar coordenadas (X, Y, Ancho, Alto) según tu plantilla
    ctx.drawImage(userFoto, 100, 280, 350, 420);
  }
}

// Escuchar eventos para redibujar al hacer clic en el botón Generar
document.getElementById('generate').addEventListener('click', drawCanvas);

// Cargar canvas inicialmente al cargar la imagen de fondo
bg.onload = drawCanvas;

// Descargar la imagen
document.getElementById('download').addEventListener('click', function() {
  const link = document.createElement('a');
  link.download = 'carne-pachangoso.jpg';
  link.href = canvas.toDataURL('image/jpeg');
  link.click();
});
</script>
</body>
